name: Test and deploy Roomies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run test:server
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: roomies-site
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: roomies-site
          path: ${{ runner.temp }}/roomies-site
      - name: Update the published site
        env:
          SITE_OUTPUT: ${{ runner.temp }}/roomies-site
        run: |
          rsync -a --delete --exclude=.git "$SITE_OUTPUT/" ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Roomies demo"
            git push origin gh-pages
          fi
      - name: Request Pages publication
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
